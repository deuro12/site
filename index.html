<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deuro.tn</title>
<meta name="description" content="Deuro.tn : mode, chaussures, accessoires, maison et plus. Paiement à la livraison partout en Tunisie.">
<meta name="theme-color" content="#0e1a2b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<style>
:root{--ink:#0e1a2b;--paper:#fff;--soft:#f4f6fa;--line:#e2e6ee;--mute:#66728a;--brand:#e63946;--brand2:#c92a37;--gold:#ffb703;--ok:#12a36b;--off:105%;--dx:26px;--ease:cubic-bezier(.32,.72,0,1)}
[dir=rtl]{--off:-105%;--dx:-26px}
*{box-sizing:border-box}
body{margin:0;font-family:Archivo,Cairo,Arial,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] select,[dir=rtl] textarea{font-family:Cairo,Archivo,Arial,sans-serif}
body.lock{overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.bar{background:var(--ink);color:#fff;text-align:center;font-size:13px;padding:8px 12px}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em;margin-inline-end:auto}
.brand img{height:40px;width:40px;object-fit:cover;border-radius:10px}
.lang{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.lang button{border:0;background:none;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;color:var(--mute);transition:.25s}
.lang button.on{background:var(--ink);color:#fff}
.pill{background:none;border:1px solid var(--line);border-radius:999px;height:42px;padding:0 16px;font-weight:700;display:flex;align-items:center;gap:8px;transition:.25s}
.pill:hover{border-color:var(--ink)}
#cartCount{background:var(--brand);color:#fff;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
.bump{animation:bump .45s var(--ease)}
@keyframes bump{40%{transform:scale(1.5)}}
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-120px;top:-120px;width:380px;height:380px;border-radius:50%;background:var(--brand);opacity:.9}
.hero>div{max-width:1200px;margin:auto;padding:64px 20px 56px;position:relative;z-index:1}
.hero h1{font-size:clamp(38px,7vw,82px);line-height:1;letter-spacing:-.035em;font-weight:800;margin:0 0 18px}
[dir=rtl] .hero h1{letter-spacing:0;line-height:1.25}
.hero h1 span{display:block;color:var(--gold)}
.hero p{color:#c3cbdb;max-width:48ch;margin:0;font-size:17px;line-height:1.6}
.trust{max-width:1200px;margin:auto;padding:22px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;border-bottom:1px solid var(--line)}
.trust div{font-size:14px;color:var(--mute);line-height:1.4}.trust b{display:block;color:var(--ink);font-size:15px}
.tools{max-width:1200px;margin:0 auto;padding:24px 20px 6px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:260px;padding-bottom:4px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;transition:.25s}
.chip:hover{border-color:var(--ink)}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools input,.tools select{height:42px;border:1px solid var(--line);border-radius:999px;padding:0 16px;font:inherit;background:var(--paper)}
.tools input{width:220px}
.grid{max-width:1200px;margin:auto;padding:16px 20px 64px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:30px 18px}
.card{cursor:pointer;background:none;border:0;text-align:start;padding:0}
.thumb{position:relative;aspect-ratio:1;background:var(--soft);border-radius:14px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.card:hover .thumb img{transform:scale(1.05)}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}
.badge.out{background:var(--ink);color:#fff}
.card h3{font-size:15px;font-weight:600;margin:12px 0 4px}
.cat{font-size:12.5px;color:var(--mute)}
.price{font-weight:800}.old{color:var(--mute);text-decoration:line-through;font-weight:400;margin-inline-start:8px;font-size:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}
.sk .thumb,.sk i{background:linear-gradient(90deg,var(--soft) 25%,#e9edf4 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
.sk i{display:block;height:14px;border-radius:6px;margin-top:12px;width:70%}
@keyframes sh{to{background-position:-200% 0}}
.overlay{position:fixed;inset:0;background:rgba(14,26,43,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.overlay.show{opacity:1;visibility:visible}
.overlay>*{transform:translateY(18px) scale(.98);transition:transform .4s var(--ease)}
.overlay.show>*{transform:none}
.modal{background:var(--paper);border-radius:18px;width:100%;max-width:880px;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr}
.modal .info{padding:28px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-size:26px;letter-spacing:-.02em}
.modal .swiper{width:100%;height:100%;min-height:340px;background:var(--soft);--swiper-theme-color:var(--brand);--swiper-navigation-size:22px}
.modal .swiper img{width:100%;height:100%;object-fit:cover}
.desc{color:var(--mute);line-height:1.6;font-size:15px;white-space:pre-line}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{min-width:46px;height:42px;border:1px solid var(--line);background:var(--paper);border-radius:10px;font-weight:600;padding:0 12px;transition:.2s}
.size.on{border-color:var(--ink);background:var(--ink);color:#fff}
.btn{background:var(--ink);color:#fff;border:0;border-radius:12px;height:50px;font-weight:700;padding:0 20px;transition:transform .2s,background .2s}
.btn:hover{background:#1b2c46}.btn:active{transform:scale(.97)}
.btn.red{background:var(--brand)}.btn.red:hover{background:var(--brand2)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--ink)}
.btn[disabled]{background:var(--line);color:var(--mute);cursor:not-allowed}
.close{align-self:flex-end;background:none;border:0;font-size:14px;color:var(--mute);text-decoration:underline}
#scrim{position:fixed;inset:0;background:rgba(14,26,43,.5);backdrop-filter:blur(3px);z-index:109;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
#scrim.show{opacity:1;visibility:visible}
#drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(430px,100%);background:var(--paper);z-index:110;display:flex;flex-direction:column;transform:translateX(var(--off));transition:transform .5s var(--ease);box-shadow:0 0 60px rgba(14,26,43,.25);border-radius:22px 0 0 22px}
[dir=rtl] #drawer{border-radius:0 22px 22px 0}
#drawer.open{transform:none}
.dHead{display:flex;justify-content:space-between;align-items:center;padding:20px;font-weight:800;font-size:20px}
.ship{padding:0 20px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.track{height:8px;background:var(--soft);border-radius:9px;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:var(--brand);border-radius:9px;width:0;transition:width .6s var(--ease),background .4s}
.track i.full{background:var(--ok)}
#cartList{flex:1;overflow:auto;padding:0 20px}
.line{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s var(--ease),opacity .3s,transform .3s var(--ease)}
.line>.inner{overflow:hidden;min-height:0;display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.line.out{grid-template-rows:0fr;opacity:0;transform:translateX(var(--dx))}
.line.in{animation:lineIn .5s var(--ease)}
@keyframes lineIn{from{opacity:0;transform:translateX(var(--dx))}}
.line img{width:70px;height:70px;border-radius:10px;object-fit:cover;background:var(--soft)}
.line .t{flex:1;font-size:14px;color:var(--mute)}.line .t b{display:block;font-size:15px;color:var(--ink)}
.qty{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--ink)}
.qty button{width:30px;height:30px;border:1px solid var(--line);background:var(--paper);border-radius:8px;transition:.2s}
.qty button:hover{border-color:var(--ink)}
.qty span{min-width:18px;text-align:center;font-weight:700;display:inline-block}
.qty span.pop{animation:bump .35s var(--ease)}
.qty .rm{width:auto;border:0;text-decoration:underline;color:var(--mute);font-size:13px;margin-inline-start:auto}
.dFoot{padding:18px 20px;border-top:1px solid var(--line);display:grid;gap:10px}
.row{display:flex;justify-content:space-between;font-size:15px}.row.total{font-weight:800;font-size:20px}
.checkout{background:var(--paper);border-radius:18px;width:100%;max-width:460px;padding:26px;display:grid;gap:10px;max-height:92vh;overflow:auto}
.checkout h3{margin:0;font-size:22px}
.checkout input,.checkout select{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;width:100%;transition:border-color .2s}
.checkout input:focus,.checkout select:focus{border-color:var(--ink);outline:0}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;color:var(--mute)}
.insta{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}
footer{background:var(--ink);color:#aab4c8;padding:40px 20px;text-align:center;font-size:14px;line-height:2}
footer b{color:#fff;font-size:20px}footer a{color:#fff;font-weight:600}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s var(--ease);z-index:300;font-weight:600}
.toast.show{opacity:1;transform:translate(-50%,0)}
.admin{display:none;max-width:760px;margin:20px auto;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--soft);direction:ltr;text-align:left}
.admin form{display:grid;gap:8px}
.admin input,.admin select,.admin textarea{padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;width:100%}
.admin .aitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--mute);transition:.25s}
.seg button.on{background:var(--ink);color:#fff}
.gp{display:flex;gap:16px}
.flinks{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.flinks button{background:none;border:0;color:#fff;font-weight:600;text-decoration:underline;font-size:14px}
.page{background:var(--paper);border-radius:18px;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:28px;line-height:1.7;font-size:15px}
.page h3{margin:0 0 12px;font-size:24px}.page h4{margin:18px 0 2px;font-size:16px}.page p{margin:0 0 4px;color:var(--mute)}.page a{color:var(--brand);font-weight:600}
@media(max-width:700px){.modal{grid-template-columns:1fr}.modal .swiper{height:300px;min-height:0}.grid{grid-template-columns:repeat(2,1fr);gap:22px 12px}.tools input{width:100%}.brand{font-size:19px}.trust{grid-template-columns:1fr}header{padding:10px 12px;gap:8px}.pill{padding:0 12px}#drawer{border-radius:0}.hero::after{width:240px;height:240px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<header>
  <div class="brand"><img src="logo.finale.png" alt="" onerror="this.style.display='none'">Deuro.tn</div>
  <div class="lang" role="group" aria-label="Langue">
    <button data-l="fr">FR</button><button data-l="en">EN</button><button data-l="ar">عربي</button>
  </div>
  <button class="pill" id="loginBtn" style="display:none" onclick="loginAdmin()">Login</button>
  <button class="pill" id="logoutBtn" style="display:none" onclick="firebase.auth().signOut()">Logout</button>
  <button class="pill" onclick="toggleCart(true)"><span data-i="cart"></span> <span id="cartCount">0</span></button>
</header>

<section class="admin" id="adminPanel">
  <h3>Gestion des produits</h3>
  <form onsubmit="return false">
    <input id="pname" placeholder="Nom du produit">
    <input id="pprice" type="number" min="0" step="0.5" placeholder="Prix actuel (TND)">
    <input id="pold" type="number" min="0" step="0.5" placeholder="Ancien prix si promo (optionnel)">
    <input id="psizes" placeholder="Tailles ou pointures : S,M,L ou 38,39,40 (vide = unique)">
    <select id="pcat"></select>
    <div class="gp"><label><input type="checkbox" id="gh" style="width:auto"> Homme</label><label><input type="checkbox" id="gf" style="width:auto"> Femme</label></div>
    <textarea id="pdesc" rows="3" placeholder="Description"></textarea>
    <input id="pimg" type="file" accept="image/*" multiple>
    <label><input type="checkbox" id="pout" style="width:auto"> Épuisé</label>
    <button class="btn red" onclick="saveProduct()">Enregistrer</button>
    <button class="btn ghost" onclick="resetForm()">Annuler la modification</button>
  </form>
  <div id="adminList"></div>
</section>

<section class="hero"><div>
  <h1><span style="color:#fff;display:inline" data-i="heroA"></span><span>Just Deuro.</span></h1>
  <p data-i="heroP"></p>
</div></section>
<section class="trust">
  <div><b data-i="t1t"></b><span data-i="t1d"></span></div>
  <div><b data-i="t2t"></b><span data-i="t2d"></span></div>
  <div><b data-i="t3t"></b><span data-i="t3d"></span></div>
</section>

<div class="tools">
  <div class="chips" id="chips"></div>
  <div class="seg" id="seg"></div>
  <input id="search" type="search" oninput="render()" data-ph="search">
  <select id="sort" onchange="render()"></select>
</div>
<main class="grid" id="shop"></main>

<footer>
  <b>Deuro.tn</b><br>
  <span data-i="f1"></span><br>
  <a href="https://ig.me/m/deuro.tn" target="_blank" rel="noopener">Instagram @deuro.tn</a>
  <div class="flinks"><button onclick="openPage('contact')" data-i="lContact"></button><button onclick="openPage('cgv')" data-i="lCgv"></button><button onclick="openPage('mentions')" data-i="lMent"></button></div>
  <span id="copy"></span>
</footer>

<div class="overlay" id="detail" onclick="if(event.target===this)closeDetail()"></div>
<div class="overlay" id="pageOv" onclick="if(event.target===this)closePage()"><div class="page" id="pageBox"></div></div>
<div id="scrim" onclick="toggleCart(false)"></div>
<aside id="drawer" aria-label="Panier">
  <div class="dHead"><span data-i="dTitle"></span><button class="close" style="align-self:auto" onclick="toggleCart(false)" data-i="close"></button></div>
  <div class="ship"><span id="shipTxt"></span><div class="track"><i id="shipBar"></i></div></div>
  <div id="cartList"></div>
  <div class="dFoot">
    <div class="row"><span data-i="shipL"></span><span id="shipCost"></span></div>
    <div class="row total"><span data-i="total"></span><span id="total"></span></div>
    <button class="btn red" onclick="openCheckout()" data-i="order"></button>
    <button class="btn ghost" onclick="clearCart()" data-i="clear"></button>
  </div>
</aside>

<div class="overlay" id="checkout" onclick="if(event.target===this)closeCheckout()">
  <div class="checkout">
    <h3 data-i="cTitle"></h3>
    <input id="nom" data-ph="nom" autocomplete="family-name">
    <input id="prenom" data-ph="prenom" autocomplete="given-name">
    <input id="tel" type="tel" data-ph="tel" autocomplete="tel">
    <select id="gouv"></select>
    <input id="adresse" data-ph="adr" autocomplete="street-address">
    <p class="note" data-i="note"></p>
    <button class="btn insta" onclick="order()" data-i="send"></button>
    <button class="btn ghost" onclick="closeCheckout()" data-i="back"></button>
  </div>
</div>

<div class="overlay" id="orderSuccess">
  <div class="checkout" style="text-align:center">
    <h3 data-i="okT"></h3>
    <div id="orderResume" class="note" style="text-align:start;direction:ltr"></div>
    <p class="note" data-i="okN"></p>
    <a class="btn insta" style="display:grid;place-items:center;text-decoration:none" href="https://ig.me/m/deuro.tn" target="_blank" rel="noopener" data-i="insta"></a>
    <button class="btn ghost" onclick="$('orderSuccess').classList.remove('show')" data-i="cont"></button>
  </div>
</div>
<div class="toast" id="toast"></div>

function compress(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{const img=new Image();img.onload=()=>{
      const k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.72))};img.src=e.target.result};
    r.readAsDataURL(file);
  });
}
async function saveProduct(){
  if(!isAdmin)return alert("Connexion admin requise");
  const name=$("pname").value.trim(),price=parseFloat($("pprice").value);
  if(!name||isNaN(price))return alert("Nom et prix obligatoires");
  const old=parseFloat($("pold").value)||0,sizes=$("psizes").value.split(",").map(s=>s.trim()).filter(Boolean);
  const data={name,price,oldPrice:old>price?old:0,sizes:sizes.length?sizes:["Unique"],desc:$("pdesc").value.trim(),cat:$("pcat").value,soldOut:$("pout").checked,genres:[$("gh").checked&&"homme",$("gf").checked&&"femme"].filter(Boolean)};
  const files=[...$("pimg").files];
  if(files.length)data.imgs=await Promise.all(files.map(compress));
  else if(!editId)return alert("Ajoutez au moins une image");
  if(data.imgs&&JSON.stringify(data.imgs).length>950000)return alert("Images trop lourdes (limite ~1 Mo par produit). Mettez moins d'images.");
  try{
    if(editId)await db.collection("produits").doc(editId).update(data);
    else await db.collection("produits").add({...data,created:Date.now()});
    resetForm();toast("OK");
  }catch(e){alert("Erreur : "+e.message)}
}
function resetForm(){editId=null;["pname","pprice","pold","psizes","pdesc","pimg"].forEach(i=>$(i).value="");$("pout").checked=false;$("gh").checked=$("gf").checked=false}
function editProduct(id){
  const p=produits.find(x=>x.id===id);if(!p)return;editId=id;
  $("pname").value=p.name;$("pprice").value=p.price;$("pold").value=p.oldPrice||"";
  $("psizes").value=(p.sizes||[]).join(",");$("pdesc").value=p.desc||"";$("pout").checked=!!p.soldOut;$("gh").checked=(p.genres||[]).includes("homme");$("gf").checked=(p.genres||[]).includes("femme");
  if(![...$("pcat").options].some(o=>o.value===p.cat))$("pcat").add(new Option(p.cat));
  $("pcat").value=p.cat;$("adminPanel").scrollIntoView({behavior:"smooth"});
}

      <span class="price">${fmt(p.price)}</span>${sale?`<span class="old">${fmt(p.oldPrice)}</span>`:""}</button>`}).join(""):`<div class="empty">${t("none")}</div>`;
}

}
function pick(b){document.querySelectorAll(".size:not(.gb)").forEach(x=>x.classList.remove("on"));b.classList.add("on");sel=b.textContent}
function pickG(b,g){document.querySelectorAll(".size.gb").forEach(x=>x.classList.remove("on"));b.classList.add("on");selG=g}
function closeDetail(){$("detail").classList.remove("show")}

// ===== PANIER =====
function toggleCart(o){
  $("drawer").classList.toggle("open",o);$("scrim").classList.toggle("show",o);
  document.body.classList.toggle("lock",o);
}
function addToCart(id){
  const p=produits.find(x=>x.id===id);if(!p||p.soldOut)return;
  const f=panier.find(i=>i.id===id&&i.size===sel&&i.g===selG);let idx=-1;
  if(f)f.q++;else{panier.push({id,name:p.name,price:p.price,size:sel,g:selG,sh:isShoe(p.cat),img:(p.imgs||[])[0]||"",q:1});idx=panier.length-1}
  save();closeDetail();displayCart(idx);
  setTimeout(()=>toggleCart(true),180);
}
function change(i,d){
  const p=panier[i];if(!p)return;
  if(p.q+d<1)return removeItem(i);
  p.q+=d;save();
  const el=document.querySelector(`[data-q="${i}"]`);
  if(el){el.textContent=p.q;el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
  updateTotals();
}
function removeItem(i){
  const el=document.querySelector(`[data-line="${i}"]`);
  if(el&&el.classList.contains("out"))return;
  const done=()=>{panier.splice(i,1);save();displayCart()};
  if(el){el.classList.add("out");setTimeout(done,320)}else done();
}
function clearCart(){if(panier.length&&confirm(t("confirmClear"))){panier=[];save();displayCart()}}
function totals(){
  const sub=panier.reduce((s,p)=>s+p.price*p.q,0),ship=sub===0||sub>=FREE_SHIP?0:SHIP_COST;
  return{sub,ship,total:sub+ship};
}
function updateTotals(){
  const x=totals(),n=panier.reduce((s,p)=>s+p.q,0),c=$("cartCount");
  c.textContent=n;
  if(n!==lastCount){c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");lastCount=n}
  $("total").textContent=fmt(x.total);
  $("shipCost").textContent=x.sub===0?"-":x.ship?fmt(x.ship):t("free");
  $("shipTxt").textContent=x.sub>=FREE_SHIP?t("shipFree"):t("shipLeft").replace("{n}",fmt(Math.max(FREE_SHIP-x.sub,0)));
  $("shipBar").style.width=Math.min(100,x.sub/FREE_SHIP*100)+"%";
  $("shipBar").classList.toggle("full",x.sub>=FREE_SHIP);
}
function displayCart(newIdx=-1){
  $("cartList").innerHTML=panier.length?panier.map((p,i)=>`<div class="line ${i===newIdx?"in":""}" data-line="${i}"><div class="inner">
    <img src="${p.img}" alt=""><div class="t"><b>${esc(p.name)}</b>${p.g?esc(gName(p.g))+"<br>":""}${p.size!=="Unique"?t(p.sh?"pt":"sz")+" : "+esc(p.size)+"<br>":""}${fmt(p.price)}
    <div class="qty"><button onclick="change(${i},-1)" aria-label="-">−</button><span data-q="${i}">${p.q}</span><button onclick="change(${i},1)" aria-label="+">+</button>
    <button class="rm" onclick="removeItem(${i})">${t("rm")}</button></div></div></div></div>`).join("")
    :`<p class="empty" style="padding:50px 0">${t("emptyCart")}</p>`;
  updateTotals();
}

// ===== COMMANDE (message toujours en français pour la boutique) =====
function openCheckout(){if(!panier.length)return toast(t("emptyCart"));$("checkout").classList.add("show")}
function closeCheckout(){$("checkout").classList.remove("show")}
async function order(){
  const v=i=>$(i).value.trim(),nom=v("nom"),prenom=v("prenom"),tel=v("tel"),gouv=v("gouv"),adresse=v("adresse");
  if(!nom||!prenom||!tel||!gouv||!adresse)return alert(t("fill"));
  if(!/^(\+216)?\d{8}$/.test(tel.replace(/\s/g,"")))return alert(t("badTel"));
  const x=totals(),f=n=>num(n)+" TND";
  let m=`COMMANDE DEURO.TN\n====================\nNom : ${nom} ${prenom}\nTéléphone : ${tel}\nGouvernorat : ${gouv}\nAdresse : ${adresse}\n\n`;
  panier.forEach(p=>{m+=`- ${p.name}${p.g?" ["+(p.g==="homme"?"Homme":"Femme")+"]":""}${p.size!=="Unique"?" ("+(p.sh?"pointure ":"taille ")+p.size+")":""} x${p.q} = ${f(p.price*p.q)}\n`});
  m+=`\nSous-total : ${f(x.sub)}\nLivraison : ${x.ship?f(x.ship):"Gratuite"}\nTOTAL À PAYER À LA LIVRAISON : ${f(x.total)}`;
  try{await navigator.clipboard.writeText(m)}catch(e){prompt("Copy / Copiez :",m)}
  $("orderResume").innerHTML=esc(m).replace(/\n/g,"<br>");
  waiting=true;window.open("https://ig.me/m/"+INSTA,"_blank");
}
window.addEventListener("focus",()=>{
  if(!waiting)return;waiting=false;
  closeCheckout();toggleCart(false);$("orderSuccess").classList.add("show");
  panier=[];save();displayCart();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDetail();closeCheckout();closePage();toggleCart(false)}});
applyLang();
</script>
</body>
</html>
