<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deuro.tn — Tout en un. Just Deuro.</title>
<meta name="description" content="Deuro.tn : vêtements, chaussures, accessoires, maison, électronique et beauté. Livraison dans toute la Tunisie, paiement à la livraison.">
<link rel="icon" href="logo.finale.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&family=Inter:wght@300;400;500;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--noir:#0b0b0c;--noir2:#17171a;--ivoire:#f7f3ea;--ivoire2:#efe8da;--or:#c9a96e;--or2:#e6d1a2;--bord:#7a1f2b;--txt:#1b1b1d;--mut:#77706a;--line:#e2d9c7;--r:4px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--ivoire);color:var(--txt);line-height:1.5;overflow-x:hidden}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] select,[dir=rtl] textarea{font-family:Tajawal,Inter,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
.serif{font-family:"Playfair Display",Georgia,serif}
.lbl{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;font-weight:500}
[dir=rtl] .lbl{letter-spacing:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
/* intro */
#intro{position:fixed;inset:0;background:var(--noir);z-index:200;display:grid;place-items:center;transition:opacity .7s,visibility .7s}
#intro img{width:120px;height:120px;border-radius:50%;object-fit:cover;animation:pulse 1.4s ease-in-out infinite}
#intro.out{opacity:0;visibility:hidden}
@keyframes pulse{50%{transform:scale(1.06);opacity:.8}}
/* header */
header{position:sticky;top:0;z-index:50;background:rgba(11,11,12,.96);backdrop-filter:blur(8px);color:var(--ivoire);border-bottom:1px solid rgba(201,169,110,.25);transition:padding .3s}
header .wrap{display:flex;align-items:center;gap:14px;height:72px;transition:height .3s}
header.small .wrap{height:56px}
.burger{width:40px;height:40px;display:grid;place-content:center;gap:5px}
.burger span{display:block;width:22px;height:1.5px;background:var(--or)}
.brand{font-family:"Playfair Display",serif;font-size:1.5rem;letter-spacing:.02em;color:var(--ivoire);text-decoration:none}
.brand b{color:var(--or);font-weight:500}
.hspace{flex:1}
.langs{display:flex;border:1px solid rgba(201,169,110,.4);border-radius:var(--r);overflow:hidden}
.langs button{padding:6px 10px;font-size:.72rem;color:var(--ivoire2)}
.langs button.on{background:var(--or);color:var(--noir)}
.cartbtn{position:relative;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--or);border-radius:var(--r);color:var(--or)}
.cartbtn .n{background:var(--or);color:var(--noir);border-radius:20px;min-width:20px;height:20px;font-size:.72rem;display:grid;place-items:center;font-weight:600}
.cartbtn .n.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.4)}}
/* sidebar */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;visibility:hidden;transition:.3s}
.ov.on{opacity:1;visibility:visible}
#side{position:fixed;top:0;bottom:0;inset-inline-start:0;width:300px;max-width:85vw;background:var(--noir);color:var(--ivoire);z-index:100;transform:translateX(-100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:24px;overflow:auto;border-inline-end:1px solid var(--or)}
[dir=rtl] #side{transform:translateX(100%)}
#side.on{transform:none}
#side .brand{display:block;margin-bottom:28px}
#side a,#side button.it{display:flex;justify-content:space-between;width:100%;padding:12px 0;color:var(--ivoire);text-decoration:none;border-bottom:1px solid rgba(201,169,110,.15);text-align:start}
#side a:hover,#side button.it:hover{color:var(--or)}
#catList{max-height:0;overflow:hidden;transition:max-height .35s}
#catList.on{max-height:600px}
#catList a{padding-inline-start:14px;font-size:.9rem;color:var(--ivoire2)}
.sep{height:20px}
/* hero */
.hero{background:var(--noir);color:var(--ivoire);overflow:hidden;position:relative}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 50%,rgba(201,169,110,.18),transparent 55%)}
.hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:40px;min-height:520px;position:relative;padding-top:50px;padding-bottom:50px}
.hero h1{font-family:"Playfair Display",serif;font-size:clamp(2.6rem,6vw,5rem);line-height:1.05;font-weight:500}
.shine{font-style:italic;background:linear-gradient(100deg,var(--or) 20%,#fff3d4 40%,var(--or) 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.hero p{color:#cfc7b7;margin:20px 0 32px;max-width:440px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;background:var(--or);color:var(--noir);border-radius:var(--r);font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem;transition:.25s}
.btn:hover{background:var(--or2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.dark{background:var(--noir);color:var(--or)}
.btn.ghost{background:transparent;border:1px solid var(--or);color:var(--or)}
.coin{justify-self:center;position:relative;width:min(340px,70vw);aspect-ratio:1}
.coin img{position:absolute;inset:12%;width:76%;height:76%;border-radius:50%;object-fit:cover;animation:float 5s ease-in-out infinite;box-shadow:0 30px 60px -20px rgba(201,169,110,.45)}
.coin .ring{position:absolute;inset:2%;border-radius:50%;border:1px solid transparent;border-top-color:var(--or);border-right-color:rgba(201,169,110,.4);animation:spin 9s linear infinite}
.coin .ring.b{inset:6%;animation-duration:14s;animation-direction:reverse;border-top-color:rgba(201,169,110,.5);border-right-color:transparent;border-bottom-color:rgba(201,169,110,.25)}
@keyframes float{50%{transform:translateY(-14px)}}
@keyframes spin{to{transform:rotate(360deg)}}
/* trust */
.trust{background:var(--ivoire2);border-bottom:1px solid var(--line)}
.trust .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-top:26px;padding-bottom:26px}
.trust div{display:flex;gap:14px;align-items:center}
.trust svg{flex:none;color:var(--or)}
.trust strong{display:block;font-family:"Playfair Display",serif;font-weight:500}
.trust small{color:var(--mut)}
/* shop */
#shop{padding:70px 0}
.sec-h{text-align:center;margin-bottom:34px}
.sec-h .lbl{color:var(--or)}
.sec-h h2{font-family:"Playfair Display",serif;font-size:2.4rem;font-weight:500;margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.chip{flex:none;padding:8px 16px;border:1px solid var(--line);border-radius:30px;font-size:.85rem;background:#fff;transition:.2s}
.chip.on{background:var(--noir);color:var(--or);border-color:var(--noir)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.tools input,.tools select{padding:11px 14px;border:1px solid var(--line);background:#fff;border-radius:var(--r);outline:none}
.tools input{flex:1;min-width:200px}
.tools input:focus,.tools select:focus{border-color:var(--or)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.seg button{padding:10px 14px;font-size:.85rem}
.seg button.on{background:var(--noir);color:var(--or)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px 20px}
.card{cursor:pointer;opacity:0;transform:translateY(28px);transition:opacity .6s,transform .6s}
.card.in{opacity:1;transform:none}
.card .ph{position:relative;aspect-ratio:3/4;background:var(--ivoire2);overflow:hidden;border-radius:var(--r)}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s,transform .8s}
.card .ph img.b{opacity:0}
.card:hover .ph img.b{opacity:1}
.card:hover .ph img{transform:scale(1.04)}
.badge{position:absolute;top:10px;inset-inline-start:10px;z-index:2;padding:4px 9px;font-size:.7rem;font-weight:600;border-radius:2px}
.badge.promo{background:var(--bord);color:#fff}
.badge.out{background:var(--noir);color:var(--or);top:auto;bottom:10px}
.card .cat{color:var(--mut);margin-top:12px;font-size:.65rem}
.card h3{font-family:"Playfair Display",serif;font-weight:500;font-size:1.05rem;margin:2px 0 4px}
.price{font-weight:600}
.price s{color:var(--mut);font-weight:400;margin-inline-start:8px;font-size:.88em}
.skel .ph{background:linear-gradient(90deg,#e9e2d3 25%,#f3eee3 50%,#e9e2d3 75%);background-size:200% 100%;animation:sk 1.3s infinite}
.skel .l{height:12px;margin-top:12px;border-radius:3px;background:#e9e2d3;animation:sk 1.3s infinite;background:linear-gradient(90deg,#e9e2d3 25%,#f3eee3 50%,#e9e2d3 75%);background-size:200% 100%}
.skel .l.s{width:60%}
@keyframes sk{to{background-position:-200% 0}}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0}
/* modal */
.modal{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:.3s}
.modal.on{opacity:1;visibility:visible}
.mbox{background:var(--ivoire);width:100%;max-width:920px;max-height:92vh;overflow:auto;border-radius:6px;position:relative;transform:translateY(20px) scale(.98);transition:.3s}
.modal.on .mbox{transform:none}
.mbox.sm{max-width:560px}
.x{position:absolute;top:10px;inset-inline-end:10px;width:38px;height:38px;border-radius:50%;background:var(--noir);color:var(--or);z-index:5;font-size:1.2rem}
.pd{display:grid;grid-template-columns:1fr 1fr}
.slider{position:relative;background:var(--ivoire2);aspect-ratio:3/4;overflow:hidden}
.slider .tr{display:flex;height:100%;transition:transform .45s}
.slider img{flex:none;width:100%;height:100%;object-fit:cover}
.slider .nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(247,243,234,.9)}
.slider .p{inset-inline-start:10px}.slider .nx{inset-inline-end:10px}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6)}
.dots i.on{background:var(--or)}
.pinfo{padding:36px 30px}
.pinfo h2{font-family:"Playfair Display",serif;font-weight:500;font-size:1.9rem;line-height:1.2;margin:6px 0 10px}
.pinfo .price{font-size:1.3rem}
.pinfo .desc{color:#4b4640;margin:18px 0;white-space:pre-line}
.opt{margin:16px 0}
.opt .lbl{display:block;margin-bottom:8px;color:var(--mut)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{min-width:44px;padding:9px 13px;border:1px solid var(--line);background:#fff;border-radius:var(--r)}
.opts button.on{border-color:var(--noir);background:var(--noir);color:var(--or)}
.err{color:var(--bord);font-size:.82rem;margin-top:6px;min-height:1em}
.legal{padding:40px 34px}
.legal h2{font-family:"Playfair Display",serif;font-weight:500;font-size:1.8rem;margin-bottom:18px}
.legal h3{font-family:"Playfair Display",serif;font-weight:500;margin:18px 0 6px}
.legal p,.legal li{color:#4b4640;font-size:.93rem}
.legal ul{padding-inline-start:20px}
/* drawer */
#cart{position:fixed;top:0;bottom:0;inset-inline-end:0;width:420px;max-width:100vw;background:var(--ivoire);z-index:110;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
[dir=rtl] #cart{transform:translateX(-100%)}
#cart.on{transform:none}
.ch{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;background:var(--noir);color:var(--ivoire)}
.ch h3{font-family:"Playfair Display",serif;font-weight:500;font-size:1.4rem}
.ch button{color:var(--or);font-size:1.4rem}
.ship{padding:16px 22px;border-bottom:1px solid var(--line);font-size:.85rem}
.bar{height:5px;background:var(--line);border-radius:5px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--or2));transition:width .5s}
#lines{flex:1;overflow:auto;padding:8px 22px}
.line{display:grid;grid-template-columns:70px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);animation:lin .35s}
.line.rm{animation:lout .3s forwards}
@keyframes lin{from{opacity:0;transform:translateX(20px)}}
@keyframes lout{to{opacity:0;transform:translateX(30px);height:0;padding:0}}
.line img{width:70px;height:90px;object-fit:cover;border-radius:3px;background:var(--ivoire2)}
.line h4{font-family:"Playfair Display",serif;font-weight:500;font-size:.98rem}
.line small{color:var(--mut);display:block}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);margin-top:8px;border-radius:3px}
.qty button{width:28px;height:28px}
.qty span{min-width:24px;text-align:center;font-size:.85rem}
.line .rmv{color:var(--mut);font-size:.75rem;text-decoration:underline;align-self:start}
.cf{padding:18px 22px;border-top:1px solid var(--line);background:#fff}
.row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:.92rem}
.row.t{font-weight:600;font-size:1.05rem;margin:10px 0 14px}
.cf .btn{width:100%}
/* form */
.form{padding:36px 30px}
.form h2{font-family:"Playfair Display",serif;font-weight:500;font-size:1.7rem;margin-bottom:4px}
.form .g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{margin-top:12px}
.f label{display:block;font-size:.78rem;color:var(--mut);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--or)}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--bord)}
.sum{background:var(--ivoire2);padding:14px;border-radius:var(--r);margin:18px 0;font-size:.88rem}
.note{font-size:.8rem;color:var(--mut);margin-top:10px}
/* footer */
footer{background:var(--noir);color:#b9b1a2;padding:50px 0 30px;font-size:.88rem}
footer .wrap{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}
footer h4{color:var(--or);margin-bottom:12px}
footer a,footer button{color:#b9b1a2;text-decoration:none;display:block;padding:3px 0;text-align:start}
footer a:hover,footer button:hover{color:var(--or)}
.copy{text-align:center;border-top:1px solid rgba(201,169,110,.2);margin-top:30px;padding-top:20px;font-size:.78rem}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:var(--noir);color:var(--or);padding:12px 22px;border-radius:var(--r);z-index:300;transition:.35s;font-size:.9rem;border:1px solid var(--or);max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
/* admin */
#adminBtn{position:fixed;bottom:20px;inset-inline-start:20px;z-index:80;display:none}
#adminBtn.on{display:inline-flex}
.adm{padding:30px}
.adm h2{font-family:"Playfair Display",serif;font-weight:500;font-size:1.6rem}
.alist{margin-top:20px;border-top:1px solid var(--line)}
.aitem{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.aitem img{width:46px;height:58px;object-fit:cover;background:var(--ivoire2)}
.aitem div{flex:1}
.aitem button{font-size:.8rem;text-decoration:underline;padding:4px}
.checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.checks label{display:flex;align-items:center;gap:6px;font-size:.88rem}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{width:64px;height:80px;object-fit:cover}
.thumbs button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--bord);color:#fff;font-size:.7rem}
@media(max-width:860px){
.hero .wrap{grid-template-columns:1fr;text-align:center;min-height:auto}
.hero p{margin-inline:auto}
.coin{order:-1;width:220px}
.trust .wrap{grid-template-columns:1fr}
.pd{grid-template-columns:1fr}
footer .wrap{grid-template-columns:1fr}
.grid{grid-template-columns:repeat(2,1fr);gap:20px 12px}
.brand{font-size:1.25rem}
.cartbtn .t{display:none}
.form .g{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
/* logo recadré (supprime le fond noir) */
:root{--zoom:1.62}
.coin .disc{position:absolute;inset:12%;border-radius:50%;overflow:hidden;animation:float 5s ease-in-out infinite;box-shadow:0 30px 60px -20px rgba(201,169,110,.45),0 0 0 2px rgba(201,169,110,.55)}
.coin .disc img{position:static;width:100%;height:100%;border-radius:0;box-shadow:none;animation:none;object-fit:cover;transform:scale(var(--zoom))}
#intro .disc2{display:block;width:120px;height:120px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--or);animation:pulse 1.4s ease-in-out infinite}
#intro .disc2 img{width:100%;height:100%;border-radius:0;animation:none;object-fit:cover;transform:scale(var(--zoom))}
</style>
</head>
<body>
<div id="intro"><span class="disc2"><img src="logo.finale.png" alt="Deuro"></span></div>

<header id="hdr"><div class="wrap">
  <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  <a href="#" class="brand" data-go="home">Deuro<b>.tn</b></a>
  <div class="hspace"></div>
  <div class="langs" id="langs"><button data-l="fr">FR</button><button data-l="en">EN</button><button data-l="ar">ع</button></div>
  <button class="cartbtn" id="cartBtn"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg><span class="t" data-i="cart"></span><span class="n" id="cartN">0</span></button>
</div></header>

<div class="ov" id="ov"></div>
<nav id="side">
  <a href="#" class="brand" data-go="home">Deuro<b>.tn</b></a>
  <a href="#" data-go="home" data-i="home"></a>
  <button class="it" id="catTgl"><span data-i="cats"></span><span id="catArr">+</span></button>
  <div id="catList"></div>
  <a href="#" data-go="promo" data-i="promos"></a>
  <a href="#" data-go="new" data-i="news"></a>
  <a href="#" data-go="homme" data-i="men"></a>
  <a href="#" data-go="femme" data-i="women"></a>
  <div class="sep"></div>
  <a href="#" data-page="contact" data-i="contact"></a>
  <a href="#" data-page="cgv" data-i="cgv"></a>
  <a href="#" data-page="mentions" data-i="mentions"></a>
  <a href="#" target="_blank" rel="noopener" class="igLink">Instagram ↗</a>
</nav>

<section class="hero" id="home"><div class="wrap">
  <div>
    <div class="lbl" style="color:var(--or)" data-i="heroTag"></div>
    <h1 style="margin-top:14px"><span data-i="heroA"></span><br><span class="shine">Just Deuro.</span></h1>
    <p data-i="heroP"></p>
    <a href="#shop" class="btn" data-i="shopNow"></a>
  </div>
  <div class="coin"><span class="ring"></span><span class="ring b"></span><span class="disc"><img src="logo.finale.png" alt="Deuro"></span></div>
</div></section>

<section class="trust"><div class="wrap">
  <div><svg width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.3" viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/></svg><span><strong data-i="t1"></strong><small data-i="t1s"></small></span></div>
  <div><svg width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.3" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="1"/><circle cx="12" cy="12" r="2.5"/></svg><span><strong data-i="t2"></strong><small data-i="t2s"></small></span></div>
  <div><svg width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.3" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg><span><strong data-i="t3"></strong><small data-i="t3s"></small></span></div>
</div></section>

<section id="shop"><div class="wrap">
  <div class="sec-h"><div class="lbl" data-i="shopTag"></div><h2 data-i="shopH"></h2></div>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <input id="q" type="search">
    <select id="sort"><option value="new"></option><option value="asc"></option><option value="desc"></option></select>
    <div class="seg" id="gseg"><button data-g="all"></button><button data-g="homme"></button><button data-g="femme"></button></div>
  </div>

function filtered(){
  let l=products.slice();
  if(F.cat!=="all") l=l.filter(p=>p.category===F.cat);
  if(F.promo) l=l.filter(p=>p.oldPrice>p.price);
  if(F.g!=="all") l=l.filter(p=>p[F.g]);
  if(F.q){const q=F.q.toLowerCase();l=l.filter(p=>(p.name+" "+(p.description||"")+" "+p.category+" "+catName(p.category)).toLowerCase().includes(q));}
  if(F.sort==="asc") l.sort((a,b)=>a.price-b.price);
  else if(F.sort==="desc") l.sort((a,b)=>b.price-a.price);
  else l.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return l;
}

    const im=p.images||[];const pct=p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;
    return `<article class="card" data-id="${p.id}" style="transition-delay:${(i%4)*70}ms">
      <div class="ph">${pct?`<span class="badge promo">-${pct}%</span>`:""}${p.soldOut?`<span class="badge out">${t("out")}</span>`:""}
      ${im[0]?`<img src="${im[0]}" alt="${esc(p.name)}" loading="lazy">`:""}${im[1]?`<img class="b" src="${im[1]}" alt="" loading="lazy">`:""}</div>
      <div class="cat lbl">${esc(catName(p.category))}</div><h3>${esc(p.name)}</h3>
      <div class="price">${money(p.price)}${pct?`<s>${money(p.oldPrice)}</s>`:""}</div></article>`;}).join("");
  $$(".card").forEach(c=>{io.observe(c);c.onclick=()=>openProduct(c.dataset.id);});
}
function renderAll(){renderChips();renderGrid();}
$("#q").oninput=e=>{F.q=e.target.value.trim();renderGrid();};
$("#sort").onchange=e=>{F.sort=e.target.value;renderGrid();};
$$("#gseg button").forEach(b=>b.onclick=()=>{F.g=b.dataset.g;$$("#gseg button").forEach(x=>x.classList.toggle("on",x===b));renderGrid();});
$$("#gseg button")[0].classList.add("on");

/* ================= navigation ================= */
function openSide(on){$("#side").classList.toggle("on",on);$("#ov").classList.toggle("on",on);}
$("#burger").onclick=()=>openSide(true);
$("#ov").onclick=()=>{openSide(false);openCart(false);};
$("#catTgl").onclick=()=>{const l=$("#catList");l.classList.toggle("on");$("#catArr").textContent=l.classList.contains("on")?"−":"+";};
function goShop(){openSide(false);renderAll();syncSeg();$("#shop").scrollIntoView({behavior:"smooth"});}
function syncSeg(){$$("#gseg button").forEach(x=>x.classList.toggle("on",x.dataset.g===F.g));$("#sort").value=F.sort;}
$$("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();const g=a.dataset.go;
  if(g==="home"){openSide(false);window.scrollTo({top:0,behavior:"smooth"});return;}
  F={cat:"all",q:F.q,sort:"new",g:"all",promo:false};
  if(g==="promo")F.promo=true; if(g==="homme"||g==="femme")F.g=g;
  goShop();});
$$("[data-page]").forEach(a=>a.onclick=e=>{e.preventDefault();openSide(false);$("#lBody").innerHTML=LEGAL_TXT[a.dataset.page][lang]();openModal("lModal");});
$$(".igLink").forEach(a=>a.href=`https://instagram.com/${INSTAGRAM}`);
window.addEventListener("scroll",()=>$("#hdr").classList.toggle("small",scrollY>40),{passive:true});

/* ================= modales ================= */
function openModal(id){$("#"+id).classList.add("on");document.body.style.overflow="hidden";}
function closeModal(el){el.classList.remove("on");if(!$$(".modal.on").length&&!$("#cart").classList.contains("on"))document.body.style.overflow="";}
$$(".modal").forEach(m=>{m.onclick=e=>{if(e.target===m||e.target.hasAttribute("data-close"))closeModal(m);};});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$$(".modal.on").forEach(closeModal);openCart(false);openSide(false);}});

/* ================= fiche produit ================= */
function openProduct(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  const im=(p.images&&p.images.length)?p.images:[""];
  const pct=p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0;
  const sizes=(p.sizes||[]).filter(Boolean);const both=p.homme&&p.femme;
  let sel={size:null,gender:both?null:(p.homme?"Homme":p.femme?"Femme":null)};let idx=0;
  $("#pBody").innerHTML=`<div class="pd">
   <div class="slider"><div class="tr">${im.map(s=>s?`<img src="${s}" alt="${esc(p.name)}">`:`<div style="flex:none;width:100%"></div>`).join("")}</div>
   ${im.length>1?`<button class="nav p">‹</button><button class="nav nx">›</button><div class="dots">${im.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`:""}
   ${pct?`<span class="badge promo">-${pct}%</span>`:""}</div>
   <div class="pinfo"><div class="lbl" style="color:var(--or)">${esc(catName(p.category))}</div>
   <h2>${esc(p.name)}</h2><div class="price">${money(p.price)}${pct?`<s>${money(p.oldPrice)}</s>`:""}</div>
   ${p.soldOut?`<p style="margin-top:8px"><span class="badge out" style="position:static">${t("out")}</span></p>`:""}
   <div class="desc">${esc(p.description||"")}</div>
   ${sizes.length?`<div class="opt"><span class="lbl">${isShoe(p)?t("shoe"):t("size")}</span><div class="opts" id="oS">${sizes.map(s=>`<button data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`:""}
   ${both?`<div class="opt"><span class="lbl">${t("gender")}</span><div class="opts" id="oG"><button data-v="Homme">${t("men")}</button><button data-v="Femme">${t("women")}</button></div></div>`:""}
   <div class="err" id="pErr"></div>
   <button class="btn" style="width:100%;margin-top:8px" id="addB" ${p.soldOut?"disabled":""}>${p.soldOut?t("out"):t("add")}</button></div></div>`;
  const tr=$("#pBody .tr");const go=i=>{idx=(i+im.length)%im.length;tr.style.transform=`translateX(${(lang==="ar"?1:-1)*idx*100}%)`;$$("#pBody .dots i").forEach((d,j)=>d.classList.toggle("on",j===idx));};
  $("#pBody .p")&&($("#pBody .p").onclick=()=>go(idx-1));$("#pBody .nx")&&($("#pBody .nx").onclick=()=>go(idx+1));
  let sx=0;tr.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});tr.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>40)go(idx+((d<0)!==(lang==="ar")?1:-1));});
  const bindOpts=(id,key)=>$$(`#${id} button`).forEach(b=>b.onclick=()=>{sel[key]=b.dataset.v;$$(`#${id} button`).forEach(x=>x.classList.toggle("on",x===b));$("#pErr").textContent="";});
  bindOpts("oS","size");bindOpts("oG","gender");
  $("#addB").onclick=()=>{
    if(p.soldOut)return;
    if(sizes.length&&!sel.size)return $("#pErr").textContent=isShoe(p)?t("pickShoe"):t("pickSize");
    if(both&&!sel.gender)return $("#pErr").textContent=t("pickGender");
    addToCart(p,sel.size,sel.gender);closeModal($("#pModal"));
  };
  openModal("pModal");
}

/* ================= panier ================= */
const saveCart=()=>localStorage.setItem("deuro_cart",JSON.stringify(cart));
const lineKey=(id,s,g)=>`${id}|${s||""}|${g||""}`;
function totals(){const sub=cart.reduce((a,l)=>a+l.price*l.qty,0);const ship=sub===0||sub>=FREE_SHIP?0:SHIP_FEE;return{sub,ship,tot:sub+ship};}
function addToCart(p,size,gender){
  const k=lineKey(p.id,size,gender);const ex=cart.find(l=>l.key===k);
  if(ex)ex.qty++;else cart.push({key:k,id:p.id,name:p.name,price:p.price,img:(p.images||[])[0]||"",category:p.category,size,gender,qty:1});
  saveCart();renderCart();toast(t("added"));const n=$("#cartN");n.classList.remove("bump");void n.offsetWidth;n.classList.add("bump");openCart(true);
}
function lineHTML(l){return `<div class="line" data-k="${esc(l.key)}">${l.img?`<img src="${l.img}" alt="">`:`<img alt="">`}
  <div><h4>${esc(l.name)}</h4><small>${[l.size?`${l.category==="Chaussures"?t("shoe"):t("size")}: ${esc(l.size)}`:"",l.gender?(l.gender==="Homme"?t("men"):t("women")):""].filter(Boolean).join(" · ")}</small>
  <small class="lp">${money(l.price*l.qty)}</small>
  <div class="qty"><button data-a="-">−</button><span>${l.qty}</span><button data-a="+">+</button></div></div>
  <button class="rmv" data-a="x">${t("remove")}</button></div>`;}
function renderCart(){
  const box=$("#lines");
  // ajoute les lignes manquantes, retire les disparues, met à jour sans tout recharger
  if(!cart.length){box.innerHTML=`<p style="text-align:center;color:var(--mut);padding:50px 0">${t("emptyCart")}</p>`;}
  else{
    if(!box.querySelector(".line"))box.innerHTML="";
    const keys=cart.map(l=>l.key);
    $$("#lines .line").forEach(el=>{if(!keys.includes(el.dataset.k)&&!el.classList.contains("rm"))el.remove();});
    cart.forEach(l=>{let el=[...box.querySelectorAll(".line")].find(e=>e.dataset.k===l.key);
      if(!el){box.insertAdjacentHTML("beforeend",lineHTML(l));}
      else{el.querySelector(".qty span").textContent=l.qty;el.querySelector(".lp").textContent=money(l.price*l.qty);el.querySelector(".rmv").textContent=t("remove");}});
  }
  const{sub,ship,tot}=totals();
  $("#cartN").textContent=cart.reduce((a,l)=>a+l.qty,0);
  $("#cSub").textContent=money(sub);$("#cShip").textContent=ship?money(ship):t("free");$("#cTot").textContent=money(tot);
  $("#shipTxt").innerHTML=sub>=FREE_SHIP?t("got"):t("left")(money(FREE_SHIP-sub));
  $("#shipBar").style.width=Math.min(100,sub/FREE_SHIP*100)+"%";
  $("#checkout").disabled=!cart.length;
}
$("#lines").onclick=e=>{const b=e.target.closest("button[data-a]");if(!b)return;const el=b.closest(".line");const l=cart.find(x=>x.key===el.dataset.k);if(!l)return;
  const a=b.dataset.a;
  if(a==="+")l.qty++;else if(a==="-")l.qty--;
  if(a==="x"||l.qty<=0){cart=cart.filter(x=>x!==l);saveCart();el.classList.add("rm");el.addEventListener("animationend",()=>{el.remove();renderCart();},{once:true});renderCartTotalsOnly();return;}
  saveCart();renderCart();};
function renderCartTotalsOnly(){const keep=$("#lines").innerHTML;renderCart();}
function openCart(on){$("#cart").classList.toggle("on",on);$("#ov").classList.toggle("on",on||$("#side").classList.contains("on"));document.body.style.overflow=on?"hidden":"";}
$("#cartBtn").onclick=()=>openCart(true);$("#cartX").onclick=()=>openCart(false);

/* ================= commande ================= */
$("#checkout").onclick=()=>{if(!cart.length)return;openCart(false);
  const{sub,ship,tot}=totals();
  $("#oSum").innerHTML=cart.map(l=>`<div class="row"><span>${l.qty} × ${esc(l.name)}</span><span>${money(l.price*l.qty)}</span></div>`).join("")+
   `<div class="row"><span>${t("shipping")}</span><span>${ship?money(ship):t("free")}</span></div><div class="row t" style="margin:6px 0 0"><span>${t("toPay")}</span><span>${money(tot)}</span></div>`;
  $("#oErr").textContent="";openModal("oModal");};
$("#oForm").tel.addEventListener("input",e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,8));
$("#oForm").onsubmit=async e=>{
  e.preventDefault();const f=e.target;const d=Object.fromEntries(new FormData(f));
  $$("#oForm .f").forEach(x=>x.classList.remove("bad"));
  let bad=false;for(const k of["nom","prenom","tel","gouv","adresse"])if(!String(d[k]||"").trim()){f[k].closest(".f").classList.add("bad");bad=true;}
  if(bad)return $("#oErr").textContent=t("errFill");
  if(!/^\d{8}$/.test(d.tel)){f.tel.closest(".f").classList.add("bad");return $("#oErr").textContent=t("errTel");}
  const{sub,ship,tot}=totals();const fmt=n=>`${Math.round(n*100)/100} TND`;
  const msg=["🛍️ NOUVELLE COMMANDE — Deuro.tn","",
   `👤 Client : ${d.prenom.trim()} ${d.nom.trim()}`,`📞 Téléphone : ${d.tel}`,`📍 Gouvernorat : ${d.gouv}`,`🏠 Adresse : ${d.adresse.trim()}`,"","📦 Articles :",
   ...cart.map(l=>`• ${l.qty} × ${l.name}${l.size?` — ${l.category==="Chaussures"?"Pointure":"Taille"} ${l.size}`:""}${l.gender?` — ${l.gender}`:""} : ${fmt(l.price*l.qty)}`),"",
   `Sous-total : ${fmt(sub)}`,`Livraison : ${ship?fmt(ship):"Offerte"}`,`💰 TOTAL À PAYER À LA LIVRAISON : ${fmt(tot)}`,"","Paiement en espèces à la livraison."].join("\n");
  let ok=false;try{await navigator.clipboard.writeText(msg);ok=true;}catch(_){const ta=document.createElement("textarea");ta.value=msg;document.body.appendChild(ta);ta.select();try{ok=document.execCommand("copy");}catch(_){}ta.remove();}
  toast(ok?t("copied"):msg);
  window.open(igUrl(),"_blank","noopener");
  cart=[];saveCart();renderCart();f.reset();closeModal($("#oModal"));
};

function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),3200);}

/* ================= admin ================= */
let typed="";document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea,select"))return;typed=(typed+e.key).slice(-10).toLowerCase();if(typed.endsWith("deuroadmin")){$("#adminBtn").classList.add("on");toast("Admin");}});
$("#adminBtn").onclick=()=>{renderAdmin();openModal("aModal");};
let editing=null, draftImgs=[];
function renderAdmin(){
  const b=$("#aBody");
  if(!auth){b.innerHTML=`<h2>Admin</h2><p class="note">Firebase n'est pas configuré (FIREBASE_CONFIG).</p>`;return;}
  if(!user){b.innerHTML=`<h2>Connexion admin</h2><form id="lg" style="max-width:360px"><div class="f"><label>E-mail</label><input name="e" type="email" required></div><div class="f"><label>Mot de passe</label><input name="p" type="password" required></div><div class="err" id="lgE"></div><button class="btn" style="margin-top:8px">Se connecter</button></form>`;
    $("#lg").onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword(e.target.e.value,e.target.p.value);}catch(err){$("#lgE").textContent="Identifiants incorrects.";}};return;}
  const p=editing?products.find(x=>x.id===editing)||{}:{};
  b.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding-inline-end:40px"><h2>${editing?"Modifier le produit":"Ajouter un produit"}</h2><button class="btn ghost" id="lo" style="color:var(--noir)">Déconnexion</button></div>
  <form id="pf">
   <div class="f"><label>Nom</label><input name="name" required value="${esc(p.name||"")}"></div>
   <div class="form g" style="padding:0"><div class="f"><label>Prix (TND)</label><input name="price" type="number" step="0.01" min="0" required value="${p.price??""}"></div>
   <div class="f"><label>Ancien prix (optionnel)</label><input name="oldPrice" type="number" step="0.01" min="0" value="${p.oldPrice??""}"></div></div>
   <div class="form g" style="padding:0"><div class="f"><label>Catégorie</label><select name="category">${Object.keys(CATS).map(c=>`<option ${p.category===c?"selected":""}>${c}</option>`).join("")}</select></div>
   <div class="f"><label>Tailles ou pointures (séparées par des virgules)</label><input name="sizes" placeholder="S, M, L ou 40, 41, 42" value="${esc((p.sizes||[]).join(", "))}"></div></div>
   <div class="checks"><label><input type="checkbox" name="homme" ${p.homme?"checked":""}> Homme</label><label><input type="checkbox" name="femme" ${p.femme?"checked":""}> Femme</label><label><input type="checkbox" name="soldOut" ${p.soldOut?"checked":""}> Épuisé</label></div>
   <div class="f"><label>Description</label><textarea name="description" rows="3">${esc(p.description||"")}</textarea></div>
   <div class="f"><label>Photos (la 1re est la principale, la 2e apparaît au survol)</label><input type="file" id="imgs" accept="image/*" multiple><div class="thumbs" id="th"></div></div>
   <div class="err" id="pfE"></div>
   <div style="display:flex;gap:10px;margin-top:8px"><button class="btn">${editing?"Enregistrer":"Ajouter"}</button>${editing?`<button type="button" class="btn ghost" id="cancel" style="color:var(--noir)">Annuler</button>`:""}</div>
  </form>
  <div class="alist">${products.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(x=>`<div class="aitem"><img src="${(x.images||[])[0]||""}" alt=""><div><b>${esc(x.name)}</b><br><small>${esc(x.category)} · ${x.price} TND${x.soldOut?" · Épuisé":""}</small></div><button data-e="${x.id}">Modifier</button><button data-d="${x.id}" style="color:var(--bord)">Supprimer</button></div>`).join("")}</div>`;
  if(!renderAdmin.keep)draftImgs=(p.images||[]).slice();renderAdmin.keep=false;
  drawThumbs();
  $("#lo").onclick=()=>auth.signOut();
  $("#cancel")&&($("#cancel").onclick=()=>{editing=null;renderAdmin();});
  $$("[data-e]").forEach(x=>x.onclick=()=>{editing=x.dataset.e;renderAdmin();$("#aModal .mbox").scrollTop=0;});
  $$("[data-d]").forEach(x=>x.onclick=async()=>{if(confirm("Supprimer ce produit ?")){await db.collection("produits").doc(x.dataset.d).delete();if(editing===x.dataset.d)editing=null;toast("Produit supprimé");}});
  $("#imgs").onchange=async e=>{for(const file of e.target.files)draftImgs.push(await compress(file));e.target.value="";drawThumbs();};
  $("#pf").onsubmit=async e=>{e.preventDefault();const f=e.target;
    const data={name:f.name.value.trim(),price:+f.price.value,oldPrice:f.oldPrice.value?+f.oldPrice.value:null,category:f.category.value,
      sizes:f.sizes.value.split(",").map(s=>s.trim()).filter(Boolean),homme:f.homme.checked,femme:f.femme.checked,soldOut:f.soldOut.checked,
      description:f.description.value.trim(),images:draftImgs};
    if(!data.name||!(data.price>=0))return $("#pfE").textContent="Nom et prix obligatoires.";
    const size=new Blob([JSON.stringify(data)]).size;if(size>1000000)return $("#pfE").textContent=`Trop lourd (${Math.round(size/1024)} Ko, max ~1000 Ko). Retirez une photo.`;
    try{if(editing)await db.collection("produits").doc(editing).update(data);else await db.collection("produits").add({...data,createdAt:Date.now()});
      toast(editing?"Produit modifié":"Produit ajouté");editing=null;draftImgs=[];renderAdmin();}
    catch(err){console.error(err);$("#pfE").textContent="Erreur d'enregistrement : "+err.message;}};
}
function drawThumbs(){const th=$("#th");if(!th)return;th.innerHTML=draftImgs.map((s,i)=>`<div><img src="${s}"><button type="button" data-r="${i}">×</button></div>`).join("");
  $$("#th [data-r]").forEach(b=>b.onclick=()=>{draftImgs.splice(+b.dataset.r,1);drawThumbs();});}
function compress(file,max=900,q=.72){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

/* ================= init ================= */
$("#yr").textContent=new Date().getFullYear();
applyLang();
window.addEventListener("load",()=>setTimeout(()=>$("#intro").classList.add("out"),900));
setTimeout(()=>$("#intro").classList.add("out"),3500);
</script>
